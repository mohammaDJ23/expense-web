name: production-expense-web

services:
    expense-web:
        image: mohammadnowresideh1997/expense-web-production:latest
        pull_policy: always
        ports:
            - '80:80'
        environment:
            NODE_ENV: production
        restart: unless-stopped
        read_only: true
        tmpfs:
            - /var/cache/nginx:mode=755
            - /var/run:mode=755
            - /tmp:mode=1777
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        cap_add:
            - CHOWN
            - SETGID
            - SETUID
            - NET_BIND_SERVICE
        healthcheck:
            test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/healthz']
            interval: 15s
            timeout: 5s
            start_period: 90s
            retries: 3
        networks:
            - expense-web
        mem_limit: 512M
        cpus: '0.5'
        logging:
            driver: json-file
            options:
                max-size: '10m'
                max-file: '3'

networks:
    expense-web:
        driver: bridge
