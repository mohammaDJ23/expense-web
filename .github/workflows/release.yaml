name: Release

on:
    push:
        branches:
            - master

concurrency:
    group: release
    cancel-in-progress: true

env:
    SHA: ${{ github.event.workflow_run.head_sha }}
    RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
    BY: ${{ github.event.workflow_run.actor.login }}

jobs:
    manual-approval:
        runs-on: ubuntu-latest
        environment: production-release
        steps:
            - name: 🛑 Manual Approval Required
              run: |
                  echo "=========================================="
                  echo "🛑 RELEASE APPROVAL REQUIRED"
                  echo "=========================================="
                  echo ""
                  echo "✅ Master Pipeline Verification:"
                  echo "   Run #: ${RUN_NUMBER}"
                  echo "   SHA: ${SHA}"
                  echo "   By: ${BY}"
                  echo ""
                  echo "=========================================="

    create-version:
        needs: manual-approval
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: write
            issues: write
        outputs:
            version: ${{ steps.release.outputs.new_release_version }}
            commit_sha: ${{ steps.release.outputs.new_release_git_head }}
            published: ${{ steps.release.outputs.new_release_published }}
        steps:
            - name: Checkout the source
              uses: actions/checkout@v4
              with:
                  ref: ${{ env.SHA }}
                  fetch-depth: 0

            - name: Install node and node_modules
              uses: ./.github/actions/setup-node

            - name: Create a New version
              id: release
              uses: cycjimmy/semantic-release-action@v4
              with:
                  extra_plugins: |
                      conventional-changelog-conventionalcommits@9.3.1
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    expense-web:
        needs: create-version
        if: needs.create-version.outputs.published == 'true'
        timeout-minutes: 30
        runs-on: ubuntu-latest
        steps:
            - name: Checkout the source
              uses: actions/checkout@v4
              with:
                  ref: ${{ needs.create-version.outputs.commit_sha }}

            - name: Install node and node_modules
              uses: ./.github/actions/setup-node

            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_PASSWORD }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v31

            - name: Create image name
              id: create-docker-image-name
              run: pnpm run name:app:docker:image
              env:
                  TAG: ${{ needs.create-version.outputs.version }}

            - name: Run the ci entrypoint
              run: pnpm run start:docker:ci
              env:
                  IMAGE: ${{ steps.create-docker-image-name.outputs.versioned_image }}

            - name: Scan the docker image
              uses: ./.github/actions/scan-docker-image
              with:
                  image_name: ${{ steps.create-docker-image-name.outputs.versioned_image }}
                  snyk_token: ${{ secrets.SNYK_TOKEN }}

            - name: Tag the images
              run: pnpm run tag:app:docker:image
              env:
                  SOURCE: ${{ steps.create-docker-image-name.outputs.versioned_image }}
                  TARGET: ${{ steps.create-docker-image-name.outputs.latest_image }}

            - name: Push versioned image to dockerhub
              run: pnpm run push:app:docker:image
              env:
                  IMAGE: ${{ steps.create-docker-image-name.outputs.versioned_image }}

            - name: Push latest image to dockerhub
              run: pnpm run push:app:docker:image
              env:
                  IMAGE: ${{ steps.create-docker-image-name.outputs.latest_image }}

            - name: Log out from DockerHub
              if: always()
              run: docker logout
